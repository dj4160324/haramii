<!doctype html><html lang="ko"><meta charset="utf-8"><title>하라미 CP-SAT 실행 점검</title><body><h1>브라우저 CP-SAT 실행 점검</h1><p>합성 시험 입력으로만 계산합니다.</p><p id="environment"></p><button id="test">실행 점검</button><pre id="result">대기</pre><iframe id="engine" src="/" style="width:1px;height:1px;visibility:hidden"></iframe><script type="module">
const out=document.getElementById('result');document.getElementById('environment').textContent='crossOriginIsolated='+crossOriginIsolated+' / SharedArrayBuffer='+typeof SharedArrayBuffer;
document.getElementById('test').onclick=async()=>{out.textContent='계산 중';try{const [{run},data]=await Promise.all([import('/assets/main.mjs'),fetch('./synthetic-gate.json').then(r=>r.json())]);const r=await run(document.getElementById('engine').contentWindow.HaramiiCPSATPolicy,data.input,data.result,{seconds:10,workers:1});out.textContent=JSON.stringify({solver:r.test1Recovery.solver.status,adopted:r.test1Recovery.adopted,beforeGap:r.test1Recovery.before.currentWeekendGap,afterGap:r.test1Recovery.after.currentWeekendGap,rawAudit:r.browserCPSAT.independentAudit.passed,confirmationReady:r.confirmationReady},null,2);}catch(e){out.textContent=e.stack||String(e)}};
</script><script src="/isolation-bootstrap.js"></script></body></html>
